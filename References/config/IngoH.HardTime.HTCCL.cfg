## Settings file was created by plugin HTCCL v1.2.1
## Plugin GUID: IngoH.HardTime.HTCCL

[General]

## Override the persistent data path, which is used for storing the cache and mappings. This is useful if you want to use a different drive for the cache and mappings, since they can get quite large. Note that this will not move the existing cache and mappings, so you will have to move them manually. Leave this empty to use the default persistent data path: C:\Users\Spark\AppData\LocalLow\MDickie\Hard Time III\HTCCL
# Setting type: String
# Default value: 
PersistentDataOverride = 

## Automatically export characters to /Export when the game is saved.
# Setting type: Boolean
# Default value: true
AutoExportCharacters = true

## Enable custom content overrides from /Overrides.
# Setting type: Boolean
# Default value: true
EnableOverrides = true

## Enable custom content loading from /Assets.
# Setting type: Boolean
# Default value: true
EnableCustomContent = true

## (EXPERIMENTAL) Allow HTCCL to use the full resolution textures without scaling them down (the game will still change the aspect ratio to fit the texture).
# Setting type: Boolean
# Default value: false
UseFullQualityTextures = false

## Allow importing characters from /Import
# Setting type: Boolean
# Default value: true
AllowImportingCharacters = true

## Delete imported characters from /Import after importing them (and saving the game).
# Setting type: Boolean
# Default value: false
DeleteImportedCharacters = false

## Enable the character search screen in the roster menu.
# Setting type: Boolean
# Default value: true
EnableCharacterSearchScreen = true

## Enable Unity log messages sent by the game itself. If you don't know what this is, leave it enabled.
# Setting type: Boolean
# Default value: true
EnableGameUnityLog = true

## The log level for Unity log messages sent by the game itself. If you don't know what this is, leave it at Warning.
# Setting type: String
# Default value: Warning
# Acceptable values: Error, Warning, Info
GameUnityLogLevel = Warning

## The maximum number of backups to keep. Set to 0 to disable backups. Set to -1 to keep all backups.
# Setting type: Int32
# Default value: 100
MaxBackups = 100

## Enable caching of custom content. This will speed up loading times with the downside of more disk space usage. The cache is stored in the .cache folder, which is hidden by default. Disabling this will automatically delete the cache on startup.
# Setting type: Boolean
# Default value: true
CacheEnabled = true

## Enable debug mode. This will create debugging files in the /Debug folder.
# Setting type: Boolean
# Default value: false
Debug = false

## Enable debug rendering. This will render debug information on the screen, such as collision boxes.
# Setting type: Boolean
# Default value: false
DebugRender = false

## The name of the save file to save to. Set to 'Save' to use the vanilla save file (not recommended). If no modded save file exists, the vanilla save file contents will be copied to a new modded save file. Note that changing this would require manually renaming the save file if you want to continue using it.
# Setting type: String
# Default value: ModdedSave
SaveFileName = ModdedSave

